# EXPERIMENT (branch exp/05-listener-platform-threads, no PR): failure rate of the
# Lab 05 SagaIntegrationTest on 2 CPUs, listener containers on virtual threads (main)
# vs platform threads (proposal). 30 runs per variant. before-diag captures diagnostics.
name: Lab 05 listener threads experiment
on:
  push:
    branches: [exp/05-listener-platform-threads]
jobs:
  runs:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Round 2: rates already measured (30/30 before vs after). Now only thread dumps
        # of failing "before" runs, without -Djdk.tracePinnedThreads (round 1 saw no failure with it).
        variant: [before-dump]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Install labs-common
        run: mvn install -f common/pom.xml -B -q -DskipTests
      - name: Use the code from main (before, before-diag)
        if: matrix.variant != 'after'
        run: rm -rf 05_saga_pattern/app/src/main/java/com/labs/saga/config
      - name: 10 runs on 2 CPUs
        working-directory: 05_saga_pattern
        shell: bash
        run: |
          # No -e: test failures and the killed watcher must not stop the loop.
          set +e
          extra=""; [ "${{ matrix.variant }}" = before-diag ] && extra="-DargLine=-Djdk.tracePinnedThreads=full"
          echo "variant=${{ matrix.variant }} shard=${{ matrix.shard }} nproc=$(nproc) taskset=0,1" | tee results.txt
          for i in $(seq 1 10); do
            ( if [ "${{ matrix.variant }}" = before-diag ] || [ "${{ matrix.variant }}" = before-dump ]; then
                # one thread dump per run, at the first "Consumer thread failed to start"
                for t in $(seq 1 600); do
                  sleep 1
                  if grep -q "Consumer thread failed to start" run-$i.log 2>/dev/null; then
                    pid=$(jps -l | awk '/surefire/{print $1}' | head -1)
                    [ -n "$pid" ] && jcmd $pid Thread.dump_to_file -format=json "$PWD/dump-$i.json" >/dev/null 2>&1
                    break
                  fi
                done
              fi ) & watcher=$!
            if taskset -c 0,1 mvn -B -q test $extra > run-$i.log 2>&1; then r=ok; else
              r=$(grep -ohE "ConditionTimeout|listeners not ready" target/surefire-reports/*.txt 2>/dev/null | head -1); r="fail ${r:-other}"; fi
            kill $watcher 2>/dev/null; wait $watcher 2>/dev/null || true
            cp target/surefire-reports/TEST-*.xml surefire-$i.xml 2>/dev/null || true
            start=$(grep -m1 -oE 'Started SagaIntegrationTest in [0-9.]+' run-$i.log surefire-$i.xml 2>/dev/null | head -1 | grep -oE '[0-9.]+$')
            cns=$(cat run-$i.log surefire-$i.xml 2>/dev/null | grep -c 'Consumer thread failed to start' || true)
            echo "${{ matrix.variant }} shard ${{ matrix.shard }} run $i: $r start=${start}s consumer-not-started=$cns" | tee -a results.txt
          done
          cat results.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab05-${{ matrix.variant }}-${{ matrix.shard }}
          path: |
            05_saga_pattern/results.txt
            05_saga_pattern/run-*.log
            05_saga_pattern/surefire-*.xml
            05_saga_pattern/dump-*.json
